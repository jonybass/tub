<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Saída - TUB</title>

</head>


<body>


<header>

<h2>Saída</h2>

<a href="../index.html">Voltar</a>

</header>
<section class="page-card">
    <h2>Retirar Estoque</h2>
    <div class="form-grid">
        <input id="rua" placeholder="Rua">
        <input id="produto" placeholder="Produto">
        <input id="codigo" placeholder="Código">
        <input id="lote" placeholder="Lote">
        <select id="tipo">
            <option>Palete</option>
            <option>Unidade</option>
            <option>Caixa</option>
            <option>Saco</option>
        </select>
        <input id="quantidade" type="number" placeholder="Quantidade">
        <input id="descricao" placeholder="Descrição">
        <button onclick="saida()">Salvar Saída</button>
        <p id="msg"></p>
    </div>
</section>
